name: Native release candidates

on:
  workflow_dispatch:
    inputs:
      version:
        description: Candidate version (not a publication)
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Native ${{ matrix.architecture }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 110
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            runner: ubuntu-24.04
          - architecture: arm64
            runner: ubuntu-24.04-arm
    env:
      STREAMTOOL_RELEASE_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Source checks
        run: bash infra/ci/run.sh checks
      - name: Build and scan exact package images
        run: bash infra/ci/run.sh release
      - name: Upload passing candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: candidate-${{ matrix.architecture }}
          path: .artifacts/*.tar.gz
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
      - name: Upload scan reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: security-${{ matrix.architecture }}
          path: .artifacts/security-streamtool-relay-*/*
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
      - name: Cleanup
        if: always()
        run: docker compose down --remove-orphans
