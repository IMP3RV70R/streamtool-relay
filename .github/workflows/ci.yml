name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: ${{ matrix.suite }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        suite: [checks, media, integration, acceptance, security-images]
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Run suite
        env:
          CI_SUITE: ${{ matrix.suite }}
        run: bash infra/ci/run.sh "$CI_SUITE"
      - name: Clean up installation acceptance
        if: always() && matrix.suite == 'acceptance'
        run: bash tests/control/down.sh
      - name: Clean up Compose
        if: always() && matrix.suite != 'acceptance'
        run: docker compose down --remove-orphans
