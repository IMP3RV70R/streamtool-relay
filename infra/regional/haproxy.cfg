global
  log stdout format raw local0
  maxconn 100000
defaults
  mode tcp
  timeout connect 3s
  timeout client 2h
  timeout server 2h
frontend srt_ingest
  bind :8890
  default_backend regional_edges
backend regional_edges
  balance leastconn
  option tcp-check
  server edge-a edge-a.internal:8890 check
  server edge-b edge-b.internal:8890 check
frontend rtmp_ingest
  bind :1935
  default_backend regional_rtmp_edges
backend regional_rtmp_edges
  balance leastconn
  server edge-a edge-a.internal:1935 check
  server edge-b edge-b.internal:1935 check
